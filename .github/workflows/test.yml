name: Tests

on:
  pull_request: # run on every PR
  push:
    branches: [master] # and again after merging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # grab your code

      - uses: actions/setup-node@v4 # install Node
        with:
          node-version: 24
          cache: npm # reuse downloads between runs, faster

      - run: npm ci # clean install from package-lock.json

      - run: npm run test:run # your tests, run once and exit
